[project]
name = "doorstep"
version = "0.1.0"
description = "AI delivery agent for small PayPal sellers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30",
  "paypal",
  "cryptography>=50.0.2",
  "anthropic>=2.4.0",
  "fastmcp>=2.12",
  "paypal-agent-toolkit>=1.11.0",
  "xgboost>=2.1 ; sys_platform != 'linux'",
  "xgboost-cpu>=2.1 ; sys_platform == 'linux'",
  "segno>=1.6.6",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "import-linter>=2.1",
  "mutmut>=3.8.1",
  "pyright>=1.1.380",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-httpserver>=1.1",
  "ragas==0.4.3",
  "ruff>=0.6",
  "schemathesis>=4",
]

[tool.uv]
package = false

[tool.uv.sources]
paypal = { git = "https://github.com/context-plugins/paypal-python-sdk.git", rev = "143e57f2a3729d7df3727386b8c9ddf023d9a5df" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "pg: needs a real Postgres (DATABASE_URL=postgresql://...)",
  "integration: replays recorded PayPal/Shippo responses",
  "eval: eval-set run (make evals)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["N802", "N818", "S101"]  # N818: exception names are part of the tested API (IllegalTransition, ...)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S603"]
"evals/**" = ["S311"]
"app/policy/reasons.py" = ["E501"]  # one message table, every line marked `# pragma: no mutate`

[tool.pyright]
include = ["app", "tuning", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# PO-01: money moves only through app/policy (hard rule 1).
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "PO-01 only app.policy and app.worker import PayPal write modules"
type = "forbidden"
source_modules = ["app.agent", "app.api", "app.ai", "app.cases", "app.mcp", "app.orders", "app.shipping"]
forbidden_modules = ["app.paypal_client.writes"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "PO-01 only app.policy imports refund and dispute writes"
type = "forbidden"
source_modules = ["app.agent", "app.api", "app.ai", "app.cases", "app.checkout", "app.demo", "app.mcp", "app.orders", "app.proof", "app.security", "app.shipping", "app.worker"]
forbidden_modules = ["app.paypal_client.writes.money"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "PO-01 AI, agent and MCP code never reach any PayPal write, even indirectly"
type = "forbidden"
source_modules = ["app.agent", "app.ai", "app.mcp"]
forbidden_modules = ["app.paypal_client.writes"]

[tool.mutmut]
# Mutation testing on the money path (RULES.md): only app/policy is mutated; the whole app is
# copied because policy imports it. Same deterministic Hypothesis seed as `make test`.
source_paths = ["app"]
only_mutate = ["app/policy/*"]
also_copy = ["rules/", "tuning/", "evals/", "docs/", "scripts/", "web/src/insights/"]
# RK tests read evals/ and docs/; AS-06 tests read the Insights menu in web/src/insights/;
# MC-04 tests load scripts/assistant_demo.py.
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property"]
# The Ragas tests import pandas/pyarrow, whose native code aborts in a forked child on macOS;
# they test the eval harness, not app/policy, so mutation runs leave them out.
pytest_add_cli_args = ["--hypothesis-seed=20261104", "--ignore=tests/unit/test_rg03_ragas_keyless.py"]
# fork after the suite has started the fake HTTP server thread segfaults on macOS
process_isolation = "forkserver"
