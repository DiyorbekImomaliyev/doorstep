# CI: lint + types + import contracts -> unit/property tests -> Postgres tests -> API fuzz ->
# secrets scan -> web build. Sandbox/test keys are never needed here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Concurrency tests need a real server: SQLite ignores FOR UPDATE and SKIP LOCKED.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: doorstep_test
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway container on the runner: no password at all
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doorstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the locked-test check compares against the tests-locked-* tag
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Lint, types, import contracts
        run: make lint
      - name: Unit and property tests, 100% branch coverage on policy and state machine
        run: make cov
      - name: Locked tests untouched
        run: make locked-untouched
      - name: Postgres concurrency tests (row locks, SKIP LOCKED; fail if Postgres is missing)
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/doorstep_test
        run: make test-pg
      - name: API fuzz (Schemathesis)
        run: make fuzz

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
