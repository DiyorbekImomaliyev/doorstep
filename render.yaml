# Render Blueprint: "Deploy to Render" builds the whole system (SPEC section 8, ADR-028).
# Sandbox and test keys only. Secrets are entered in the dashboard (sync: false), never here.
envVarGroups:
  - name: doorstep-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # Generated once, shared by web and worker, so links and receipts verify in both.
      - key: SIGNING_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_KEY   # 256-bit base64 value = an Ed25519 seed
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      # AG Grid Enterprise and AG Studio trial keys: read by the web build (vite.config.ts), never committed.
      - key: AG_GRID_LICENSE_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SHIPPO_API_KEY
        sync: false
      - key: SHIPPO_WEBHOOK_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

services:
  - type: web
    name: doorstep
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      cd web && npm ci && npm run build
    startCommand: uv run --no-dev uvicorn app.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: doorstep-shared
      - key: DATABASE_URL
        fromDatabase:
          name: doorstep-db
          property: connectionString

  # Webhook inbox, PayPal/Shippo jobs (outbox) and the stale-tracking sweep (every 5 min).
  - type: worker
    name: doorstep-worker
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev python -m app.worker.main
    autoDeploy: true
    envVars:
      - fromGroup: doorstep-shared
      - key: DATABASE_URL
        fromDatabase:
          name: doorstep-db
          property: connectionString

databases:
  - name: doorstep-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
